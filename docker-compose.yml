# Sobe o servidor MCP (cadastro da operadora) e o agente, para testar na máquina.
services:
  mcp:
    # o servidor está em mcp/
    build: ./mcp
    ports:
      - "9000:9000"
    environment:
      MCP_OPERADORA_TOKEN: treino
      MCP_OPERADORA_DADOS: /dados
    volumes:
      # cada casos/treino/*/persona.json vira um beneficiário
      - ./casos/treino:/dados:ro

  agente:
    build: .
    depends_on:
      - mcp
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # dentro da rede do compose o MCP atende pelo nome do serviço
      MCP_OPERADORA_URL: http://mcp:9000/mcp
